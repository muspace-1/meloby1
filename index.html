<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ᨳꪔׄeloྀིbyᩍ っ - ติดต่อร้านค้า</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e3a8a;
        }
        .card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 28px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(14, 165, 233, 0.15);
            position: relative;
        }
        .profile-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 24px auto;
        }
        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }
        .shop-name {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 16px;
            background: linear-gradient(270deg, #0284c7, #38bdf8, #1d4ed8, #0284c7);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 6s ease infinite;
            letter-spacing: 0.5px;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .tagline {
            background: #f0f9ff;
            border: 1px solid #e0f2fe;
            color: #0369a1;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 30px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .status-badge:hover {
            transform: scale(1.03);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .line-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3);
            transition: all 0.25s ease;
            margin-bottom: 15px;
        }
        .line-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(2, 132, 199, 0.4);
        }
        .line-link-text {
            font-size: 12px;
            color: #64748b;
            text-decoration: none;
            display: block;
            margin-top: 10px;
            word-break: break-all;
        }
        .line-link-text:hover {
            color: #0284c7;
            text-decoration: underline;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 999;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal {
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 320px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            text-align: left;
        }
        .modal h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #0f172a;
        }
        .modal label {
            font-size: 12px;
            color: #475569;
            display: block;
            margin-bottom: 4px;
        }
        .modal input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
        }
        .modal input[type="text"]:focus {
            border-color: #0284c7;
        }
        .color-options {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .color-opt {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }
        .color-opt.selected {
            border-color: #0f172a;
            transform: scale(1.1);
        }
        .modal-btns {
            display: flex;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-save {
            background: #0284c7;
            color: #fff;
        }
        .btn-cancel {
            background: #e2e8f0;
            color: #334155;
        }
        .hint-text {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Profile Image (เปลี่ยนชื่อไฟล์รูปภาพให้ตรงกับที่คุณมี หรือใช้ชื่อ image.png) -->
        <div class="profile-container">
            <img src="image.png" alt="Logo" class="profile-img" onerror="this.src='https://via.placeholder.com/130/bae6fd/ffffff?text=Logo'">
        </div>

        <h1 class="shop-name">ᨳꪔׄeloྀིbyᩍ っ</h1>

        <div class="tagline">
            ใช้สำหรับติดต่อซื้อขาย สอบถาม เท่านั้น งดทักเล่น
        </div>

        <div id="statusBadge" class="status-badge" style="background-color: #d1fae5; color: #065f46;" title="คลิกค้างไว้ 2 วินาทีเพื่อแก้ไขสถานะ">
            <span id="statusDot" class="status-dot" style="background-color: #10b981;"></span>
            <span id="statusText">เปิดรับออร์เดอร์ปกติ</span>
        </div>

        <a href="https://lin.ee/5mrH0GV" target="_blank" class="line-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M24 10.304c0-5.364-5.38-9.73-12-9.73s-12 4.366-12 9.73c0 4.812 4.71 8.842 11.07 9.534.432.048.1.372.012.72-.12.444-.42 1.62-.48 2.028-.06.372.168.36.42.216 1.74-1.02 3.96-2.22 5.4-3.48 3.51-.576 5.6-3.144 5.6-5.496.004-.372-.012-.552-.012-.552zm-15.63-1.896h-2.1c-.276 0-.48.204-.48.48v4.5c0 .276.204.48.48.48h2.1c.276 0 .48-.204.48-.48v-4.5c0-.276-.204-.48-.48-.48zm4.5 0h-2.1c-.276 0-.48.204-.48.48v4.5c0 .276.204.48.48.48h2.1c.276 0 .48-.204.48-.48v-4.5c0-.276-.204-.48-.48-.48zm5.1 0h-2.1c-.276 0-.48.204-.48.48v1.896h-1.62v-1.896c0-.276-.204-.48-.48-.48h-2.1c-.276 0-.48.204-.48.48v4.5c0 .276.204.48.48.48h2.1c.276 0 .48-.204.48-.48v-1.896h1.62v1.896c0 .276.204.48.48.48h2.1c.276 0 .48-.204.48-.48v-4.5c0-.276-.204-.48-.48-.48zm-1.8 4.2h-1.5v-1.2h1.5v1.2z"/></svg>
            ติดต่อ Line OA
        </a>

        <a href="https://lin.ee/5mrH0GV" target="_blank" class="line-link-text">https://lin.ee/5mrH0GV</a>
        
        <div class="hint-text">*คลิกค้างที่ป้ายสถานะ 2 วินาทีเพื่อเปลี่ยนข้อความหรือสี</div>
    </div>

    <!-- Modal Popup -->
    <div id="statusModal" class="modal-overlay">
        <div class="modal">
            <h3>แก้ไขสถานะร้านค้า</h3>
            <label for="statusInput">ข้อความสถานะ:</label>
            <input type="text" id="statusInput" placeholder="พิมพ์ข้อความสถานะ...">
            
            <label>เลือกโทนสีสถานะ:</label>
            <div class="color-options">
                <div class="color-opt selected" style="background: #10b981;" data-bg="#d1fae5" data-color="#065f46" data-dot="#10b981"></div>
                <div class="color-opt" style="background: #f59e0b;" data-bg="#fef3c7" data-color="#b45309" data-dot="#f59e0b"></div>
                <div class="color-opt" style="background: #ef4444;" data-bg="#fee2e2" data-color="#991b1b" data-dot="#ef4444"></div>
                <div class="color-opt" style="background: #8b5cf6;" data-bg="#ede9fe" data-color="#5b21b6" data-dot="#8b5cf6"></div>
            </div>

            <div class="modal-btns">
                <button class="modal-btn btn-cancel" onclick="closeModal()">ยกเลิก</button>
                <button class="modal-btn btn-save" onclick="saveStatus()">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        const statusBadge = document.getElementById('statusBadge');
        const statusModal = document.getElementById('statusModal');
        const statusInput = document.getElementById('statusInput');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const colorOpts = document.querySelectorAll('.color-opt');

        let holdTimer = null;
        let selectedBg = "#d1fae5";
        let selectedColor = "#065f46";
        let selectedDot = "#10b981";

        // โหลดข้อมูลสถานะเดิมที่เคยบันทึกไว้ใน LocalStorage (ถ้ามี)
        if(localStorage.getItem('shop_status_text')) {
            statusText.innerText = localStorage.getItem('shop_status_text');
            selectedBg = localStorage.getItem('shop_status_bg') || selectedBg;
            selectedColor = localStorage.getItem('shop_status_color') || selectedColor;
            selectedDot = localStorage.getItem('shop_status_dot') || selectedDot;
            
            statusBadge.style.backgroundColor = selectedBg;
            statusBadge.style.color = selectedColor;
            statusDot.style.backgroundColor = selectedDot;
        }

        // ระบบเลือกสี
        colorOpts.forEach(opt => {
            opt.addEventListener('click', () => {
                colorOpts.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedBg = opt.getAttribute('data-bg');
                selectedColor = opt.getAttribute('data-color');
                selectedDot = opt.getAttribute('data-dot');
            });
        });

        // ระบบนับเวลาคลิกค้าง 2 วินาที (ป้องกันการค้างและการทัชซ้อน)
        const startHold = (e) => {
            holdTimer = setTimeout(() => {
                statusInput.value = statusText.innerText;
                statusModal.classList.add('active');
            }, 2000);
        };

        const cancelHold = () => {
            clearTimeout(holdTimer);
        };

        // รองรับการคลิกด้วยเมาส์
        statusBadge.addEventListener('mousedown', startHold);
        statusBadge.addEventListener('mouseup', cancelHold);
        statusBadge.addEventListener('mouseleave', cancelHold);

        // รองรับการสัมผัสบนมือถือ
        statusBadge.addEventListener('touchstart', startHold);
        statusBadge.addEventListener('touchend', cancelHold);
        statusBadge.addEventListener('touchcancel', cancelHold);

        // ปิด Pop-up
        function closeModal() {
            statusModal.classList.remove('active');
        }

        // บันทึกสถานะใหม่และเปลี่ยนสีทันที
        function saveStatus() {
            const newText = statusInput.value.trim();
            if(newText) {
                statusText.innerText = newText;
                statusBadge.style.backgroundColor = selectedBg;
                statusBadge.style.color = selectedColor;
                statusDot.style.backgroundColor = selectedDot;

                // บันทึกลงในเครื่อง (ลูกค้าไม่ต้องกดเปลี่ยนใหม่ทุกครั้งที่เปิดเว็บ)
                localStorage.setItem('shop_status_text', newText);
                localStorage.setItem('shop_status_bg', selectedBg);
                localStorage.setItem('shop_status_color', selectedColor);
                localStorage.setItem('shop_status_dot', selectedDot);
            }
            closeModal();
        }
    </script>
</body>
</html>
