<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ᨳꪔׄeloྀིbyᩍ っ - ติดต่อร้านค้า</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }
        body {
            /* พื้นหลังสีขาวสว่างสำหรับให้ก้อนสีเบลอดูโดดเด่น */
            background-color: #f0f9ff; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e3a8a;
            overflow: hidden;
            position: relative;
        }

        /* 1. เอฟเฟกต์ก้อนสีเบลอเคลื่อนไหว (Moving Blur Blobs) */
        .blobs {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
            animation: moveBlob 12s infinite alternate ease-in-out;
        }
        .blob-1 { width: 300px; height: 300px; background: #7dd3fc; top: -10%; left: -10%; }
        .blob-2 { width: 350px; height: 350px; background: #bae6fd; bottom: -20%; right: -10%; animation-delay: -3s; }
        .blob-3 { width: 250px; height: 250px; background: #38bdf8; top: 40%; left: 50%; animation-delay: -6s; opacity: 0.4; }

        @keyframes moveBlob {
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        /* 2. กรอบการ์ดลอยขึ้นลง (Floating Card) */
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            padding: 40px 30px 35px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(14, 165, 233, 0.1);
            position: relative;
            z-index: 1;
            animation: cardFloat 6s ease-in-out infinite;
        }
        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* 3. ไอคอนตกแต่งแบบทึบ (Solid Icons) */
        .decor {
            position: absolute;
            fill: rgba(255, 255, 255, 0.9);
            z-index: 2;
            pointer-events: none;
            animation: floatDecor 4s ease-in-out infinite alternate;
        }
        .decor-bubble {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: inset -2px -2px 6px rgba(255,255,255,0.4), 0 4px 8px rgba(0,0,0,0.05);
        }
        .d-1 { top: -15px; left: -10px; width: 28px; height: 28px; animation-delay: 0s; }
        .d-2 { top: 35%; right: -15px; width: 14px; height: 14px; animation-delay: 1s; }
        .d-3 { bottom: 25px; left: -15px; width: 22px; height: 22px; animation-delay: 2s; }
        @keyframes floatDecor {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-10px) scale(1.05); }
        }

        /* 4. รูปโปรไฟล์เด้งดึ๋งตอนโหลด (Pop-in) */
        .profile-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 24px auto;
            z-index: 3;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0);
        }
        @keyframes popIn {
            to { transform: scale(1); opacity: 1; }
        }
        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }

        /* ชื่อร้านสีวิ่ง */
        .shop-name {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 16px;
            background: linear-gradient(270deg, #0284c7, #38bdf8, #1d4ed8, #0284c7);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 6s ease infinite;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 3;
        }

        /* 5. คำโปรยค่อยๆ เฟดขึ้นมา (Fade-in) */
        .tagline {
            background: rgba(240, 249, 255, 0.8);
            border: 1px solid #e0f2fe;
            color: #0369a1;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 20px;
            line-height: 1.5;
            position: relative;
            z-index: 3;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 0.4s;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* ป้ายสถานะแบบเล็กกะทัดรัด */
        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 5px 14px; /* ขนาดเล็กลง */
            border-radius: 50px;
            font-size: 12px; /* ฟอนต์เล็กลง */
            font-weight: 500;
            margin: 0 auto 30px auto;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            width: fit-content; /* ยืดหดตามข้อความ */
            max-width: 100%;
            position: relative;
            z-index: 3;
        }
        .status-badge:hover {
            transform: scale(1.03);
        }

        /* 6. ไฟกะพริบสถานะ (Breathing Pulse) */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            /* ตัวแปรสีจะถูกเปลี่ยนจาก JS */
            --pulse-color: #10b981; 
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 var(--pulse-color); }
            70% { box-shadow: 0 0 0 6px transparent; }
            100% { box-shadow: 0 0 0 0 transparent; }
        }

        /* 7. ปุ่ม Line พร้อมแสงสะท้อนวิ่งผ่าน (Shine Sweep) */
        .line-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3);
            transition: all 0.25s ease;
            position: relative;
            z-index: 3;
            overflow: hidden; /* บังแสงที่วิ่งเกินกรอบ */
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 0.6s;
        }
        .line-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(2, 132, 199, 0.4);
        }
        /* แสงสะท้อน */
        .line-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 4s infinite;
        }
        @keyframes shine {
            0% { left: -100%; }
            20%, 100% { left: 200%; }
        }

        /* Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 999;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal {
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 320px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            text-align: left;
        }
        .modal h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #0f172a;
        }
        .modal label {
            font-size: 12px;
            color: #475569;
            display: block;
            margin-bottom: 4px;
        }
        .modal input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
        }
        .modal input[type="text"]:focus {
            border-color: #0284c7;
        }
        .color-options {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .color-opt {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }
        .color-opt.selected {
            border-color: #0f172a;
            transform: scale(1.1);
        }
        .modal-btns {
            display: flex;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-save {
            background: #0284c7;
            color: #fff;
        }
        .btn-cancel {
            background: #e2e8f0;
            color: #334155;
        }
    </style>
</head>
<body>

    <!-- พื้นหลังก้อนสีเบลอ -->
    <div class="blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="card">
        <!-- ดาวทึบ SVG (Star) -->
        <svg class="decor d-1" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
        </svg>
        <!-- ฟองอากาศ CSS -->
        <div class="decor decor-bubble d-2"></div>
        <!-- ดาวทึบ SVG (Star) -->
        <svg class="decor d-3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/>
        </svg>

        <!-- รูปโปรไฟล์ -->
        <div class="profile-container">
            <img src="logo.JPG" alt="Logo" class="profile-img" onerror="this.src='https://via.placeholder.com/130/bae6fd/ffffff?text=Logo'">
        </div>

        <h1 class="shop-name">ᨳꪔׄeloྀིbyᩍ っ</h1>

        <div class="tagline">
            ใช้สำหรับติดต่อซื้อขาย สอบถาม เท่านั้น งดทักเล่น
        </div>

        <div id="statusBadge" class="status-badge" style="background-color: #d1fae5; color: #065f46;">
            <span id="statusDot" class="status-dot" style="background-color: #10b981;"></span>
            <span id="statusText">เปิดรับออร์เดอร์ปกติ</span>
        </div>

        <a href="https://lin.ee/5mrH0GV" target="_blank" class="line-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M24 10.304c0-5.364-5.38-9.73-12-9.73s-12 4.366-12 9.73c0 4.812 4.71 8.842 11.07 9.534.432.048.1.372.012.72-.12.444-.42 1.62-.48 2.028-.06.372.168.36.42.216 1.74-1.02 3.96-2.22 5.4-3.48 3.51-.576 5.6-3.144 5.6-5.496.004-.372-.012-.552-.012-.552zm-15.63-1.896h-2.1c-.276 0-.48.204-.48.48v4.5c0 .276.204.48.48.48h2.1c.276 0 .48-.204.48-.48v-4.5c0-.276-.204-.48-.48-.48zm4.5 0h-2.1c-.276 0-.48.204-.48.48v4.5c0 .276.204.48.48.48h2.1c.276 0 .48-.204.48-.48v-4.5c0-.276-.204-.48-.48-.48zm5.1 0h-2.1c-.276 0-.48.204-.48.48v1.896h-1.62v-1.896c0-.276-.204-.48-.48-.48h-2.1c-.276 0-.48.204-.48.48v4.5c0 .276.204.48.48.48h2.1c.276 0 .48-.204.48-.48v-1.896h1.62v1.896c0 .276.204.48.48.48h2.1c.276 0 .48-.204.48-.48v-4.5c0-.276-.204-.48-.48-.48zm-1.8 4.2h-1.5v-1.2h1.5v1.2z"/></svg>
            ติดต่อ Line OA
        </a>
    </div>

    <!-- Modal Popup -->
    <div id="statusModal" class="modal-overlay">
        <div class="modal">
            <h3>แก้ไขสถานะร้านค้า</h3>
            <label for="statusInput">ข้อความสถานะ:</label>
            <input type="text" id="statusInput" placeholder="พิมพ์ข้อความสถานะ...">
            
            <label>เลือกโทนสีสถานะ:</label>
            <div class="color-options">
                <div class="color-opt selected" style="background: #10b981;" data-bg="#d1fae5" data-color="#065f46" data-dot="#10b981"></div>
                <div class="color-opt" style="background: #f59e0b;" data-bg="#fef3c7" data-color="#b45309" data-dot="#f59e0b"></div>
                <div class="color-opt" style="background: #ef4444;" data-bg="#fee2e2" data-color="#991b1b" data-dot="#ef4444"></div>
                <div class="color-opt" style="background: #8b5cf6;" data-bg="#ede9fe" data-color="#5b21b6" data-dot="#8b5cf6"></div>
            </div>

            <div class="modal-btns">
                <button class="modal-btn btn-cancel" onclick="closeModal()">ยกเลิก</button>
                <button class="modal-btn btn-save" onclick="saveStatus()">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        const statusBadge = document.getElementById('statusBadge');
        const statusModal = document.getElementById('statusModal');
        const statusInput = document.getElementById('statusInput');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const colorOpts = document.querySelectorAll('.color-opt');

        let holdTimer = null;
        let selectedBg = "#d1fae5";
        let selectedColor = "#065f46";
        let selectedDot = "#10b981";

        // ฟังก์ชันกำหนดสีให้ตัวแปร CSS ของจุดสถานะ (เพื่อทำเอฟเฟกต์ไฟกะพริบ)
        function updatePulseColor(color) {
            statusDot.style.setProperty('--pulse-color', color);
        }

        if(localStorage.getItem('shop_status_text')) {
            statusText.innerText = localStorage.getItem('shop_status_text');
            selectedBg = localStorage.getItem('shop_status_bg') || selectedBg;
            selectedColor = localStorage.getItem('shop_status_color') || selectedColor;
            selectedDot = localStorage.getItem('shop_status_dot') || selectedDot;
            
            statusBadge.style.backgroundColor = selectedBg;
            statusBadge.style.color = selectedColor;
            statusDot.style.backgroundColor = selectedDot;
            updatePulseColor(selectedDot);
        } else {
            updatePulseColor(selectedDot); // โหลดครั้งแรกตั้งค่าไฟกะพริบสีเขียว
        }

        colorOpts.forEach(opt => {
            opt.addEventListener('click', () => {
                colorOpts.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedBg = opt.getAttribute('data-bg');
                selectedColor = opt.getAttribute('data-color');
                selectedDot = opt.getAttribute('data-dot');
            });
        });

        const startHold = (e) => {
            holdTimer = setTimeout(() => {
                statusInput.value = statusText.innerText;
                statusModal.classList.add('active');
            }, 2000);
        };

        const cancelHold = () => {
            clearTimeout(holdTimer);
        };

        statusBadge.addEventListener('mousedown', startHold);
        statusBadge.addEventListener('mouseup', cancelHold);
        statusBadge.addEventListener('mouseleave', cancelHold);
        statusBadge.addEventListener('touchstart', startHold);
        statusBadge.addEventListener('touchend', cancelHold);
        statusBadge.addEventListener('touchcancel', cancelHold);

        function closeModal() {
            statusModal.classList.remove('active');
        }

        function saveStatus() {
            const newText = statusInput.value.trim();
            if(newText) {
                statusText.innerText = newText;
                statusBadge.style.backgroundColor = selectedBg;
                statusBadge.style.color = selectedColor;
                statusDot.style.backgroundColor = selectedDot;
                updatePulseColor(selectedDot); // อัปเดตสีไฟกะพริบ

                localStorage.setItem('shop_status_text', newText);
                localStorage.setItem('shop_status_bg', selectedBg);
                localStorage.setItem('shop_status_color', selectedColor);
                localStorage.setItem('shop_status_dot', selectedDot);
            }
            closeModal();
        }
    </script>
</body>
</html>
